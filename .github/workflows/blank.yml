name: Build SSH Protocol APK

on:
  push:
    paths:
      - "**.zip"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract uploaded ZIP
        shell: bash
        run: |
          shopt -s nullglob
          archives=( *.zip )
          if (( ${#archives[@]} == 0 )); then
            echo "Tidak ditemukan file ZIP di root repository."
            exit 1
          fi

          for archive in "${archives[@]}"; do
            echo "Extracting: $archive"
            unzip -oq "$archive" -d "$GITHUB_WORKSPACE"
          done

          if [[ ! -f "$GITHUB_WORKSPACE/gradlew" ]]; then
            echo "gradlew tidak ditemukan di root setelah ekstraksi."
            echo "Pastikan isi ZIP berisi gradlew, settings.gradle.kts, dan folder app/ di root ZIP."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Prepare Gradle for GitHub runner
        shell: bash
        run: |
          chmod +x ./gradlew

          # Project ZIP dibuat di Termux; jangan gunakan SDK path lokal Termux.
          rm -f local.properties

          # AGP 8.13.0 berjalan dengan Gradle 8.13.
          sed -i 's/gradle-9\.0\.0-bin\.zip/gradle-8.13-bin.zip/' gradle/wrapper/gradle-wrapper.properties

          # Hapus override aapt2 yang menunjuk ke instalasi Termux.
          sed -i '/^android\.aapt2FromMavenOverride=/d' gradle.properties

      - name: Build debug APK
        run: ./gradlew --no-daemon clean assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SSH-Protocol-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
          
